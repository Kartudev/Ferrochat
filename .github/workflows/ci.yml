name: CI

on:
  push:
    branches: [main, development, "feat/**"]
  pull_request:
    branches: [main, development]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake libdbus-1-dev libasound2-dev \
            libxkbcommon-dev libwayland-dev libssl-dev libfontconfig1-dev dbus gnome-keyring
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings
      # A private session bus: the tray test registers on a fake StatusNotifierWatcher.
      - name: cargo test
        run: dbus-run-session -- cargo test

      # The video helper must run on a machine with no codec packages: build it
      # the way the release does (libstdc++ static) and check what it links.
      - name: Video helper links nothing beyond the base system
        run: |
          export CXXSTDLIB=static=stdc++
          export RUSTFLAGS="-L native=$(dirname "$(g++ -print-file-name=libstdc++.a)")"
          cargo build --bin ferrochat-player
          .github/scripts/check-helper-libs.sh target/debug/ferrochat-player

      # Real Secret Service: guards the zbus executor feature (tokio vs async-io)
      # that keyring's blocking connection depends on.
      - name: cargo test real_keyring (gnome-keyring on a private bus)
        env:
          FERRO_REAL_KEYRING: "1"
        run: |
          dbus-run-session -- sh -c 'echo | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo test --test real_keyring -- --ignored'

  # Windows x86_64 (MSVC): clippy, the whole test suite, a real start of the
  # app (screenshot), and the release zip installed and removed by install.ps1.
  windows:
    runs-on: windows-latest
    env:
      # Git's perl (first on PATH) lacks modules OpenSSL's Configure needs.
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      - name: App starts and renders (screenshot)
        run: |
          cargo build --bins
          $p = Start-Process -FilePath target\debug\ferrochat.exe -ArgumentList '--screenshot','chats','win-chats.png' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "ferrochat did not finish the screenshot in time" }
          if ($p.ExitCode -ne 0) { throw "ferrochat exited with $($p.ExitCode)" }
          if (-not (Test-Path win-chats.png) -or (Get-Item win-chats.png).Length -lt 10000) { throw "no screenshot" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: win-chats.png
          if-no-files-found: ignore
      - name: Package the zip and install / uninstall it with install.ps1
        run: |
          .github/scripts/package-windows.ps1 -Version 0.0.1 -BinDir target/debug -OutDir dist
          $name = "ferrochat-v0.0.1-windows-x86_64"
          $dist = (Resolve-Path dist).Path
          $u = { param($f) ([Uri](Join-Path $dist $f)).AbsoluteUri }
          @{ tag_name = "v0.0.1"; draft = $false; prerelease = $false; assets = @(
              @{ name = "$name.zip"; browser_download_url = (& $u "$name.zip") },
              @{ name = "$name.zip.sha256"; browser_download_url = (& $u "$name.zip.sha256") }) } |
            ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 dist/latest.json
          $env:FERRO_RELEASE_API = & $u "latest.json"
          ./install.ps1
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Ferrochat"
          foreach ($f in "ferrochat.exe", "ferrochat-player.exe", "installed-version", "licenses\OpenSSL-Apache-2.0.txt") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "install.ps1 did not install $f" }
          }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath("Programs")) "Ferrochat.lnk"))) { throw "no Start Menu shortcut" }
          & (Join-Path $dir "ferrochat.exe") --help
          if ($LASTEXITCODE -ne 0) { throw "installed ferrochat.exe --help failed" }
          ./install.ps1 -Uninstall
          if (Test-Path $dir) { throw "install.ps1 -Uninstall left $dir" }
