name: Release

# Publishes a GitHub Release (Linux x86_64 tarball + Windows x86_64 zip, each
# with a .sha256) after every successful "Version bump" run on main. The bump commit that workflow pushes
# uses GITHUB_TOKEN, which never triggers `push` workflows, so this chains off
# `workflow_run` instead. Re-run manually from Actions -> Release -> Run
# workflow; it skips when release v<Cargo.toml version> already exists.
on:
  workflow_run:
    workflows: ["Version bump"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sha: ${{ steps.ver.outputs.sha }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read version and check for an existing release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    env:
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --locked
      - name: Package
        run: .github/scripts/package-windows.ps1 -Version "${{ needs.prepare.outputs.version }}" -BinDir target/release -OutDir dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    needs: [prepare, windows]
    if: needs.prepare.outputs.skip != 'true'
    # Oldest supported runner image: the binary links an older glibc and so runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Version
        id: ver
        run: |
          echo "version=${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ needs.prepare.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Install system libraries
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake libdbus-1-dev libasound2-dev \
            libxkbcommon-dev libwayland-dev libssl-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
      - name: Build release binary
        if: steps.ver.outputs.skip != 'true'
        run: |
          # OpenH264 (C++) is built from source; link libstdc++ statically so the
          # video helper needs no C++ runtime package on the user's machine.
          export CXXSTDLIB=static=stdc++
          export RUSTFLAGS="-L native=$(dirname "$(g++ -print-file-name=libstdc++.a)")"
          cargo build --release --locked
      - name: Shared libraries of the binary
        if: steps.ver.outputs.skip != 'true'
        run: |
          ldd target/release/ferrochat
          # No codec libraries anywhere; the helper needs only the base system.
          if ldd target/release/ferrochat | grep -Eqi 'gst|openh264|stdc\+\+'; then echo "::error::ferrochat links a codec library"; exit 1; fi
          .github/scripts/check-helper-libs.sh target/release/ferrochat-player
      - name: Package
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          name="ferrochat-v${VERSION}-linux-x86_64"
          mkdir -p "dist/$name/packaging" "dist/$name/licenses"
          cp target/release/ferrochat target/release/ferrochat-player README.md LICENSE "dist/$name/"
          cp packaging/dev.ferro.ferrochat.desktop "dist/$name/packaging/dev.ferro.ferrochat.desktop"
          cp packaging/dev.ferro.ferrochat.svg "dist/$name/packaging/dev.ferro.ferrochat.svg"
          cp assets/fonts/Inter-LICENSE.txt "dist/$name/licenses/Inter-OFL.txt"
          cp assets/icons/LICENSE "dist/$name/licenses/Lucide-ISC.txt"
          cp "$(find ~/.cargo/registry/src -path '*openh264-sys2-*/upstream/LICENSE' | head -n 1)" \
            "dist/$name/licenses/OpenH264-BSD-2-Clause.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          name: windows-release
          path: dist
      - name: Check the Windows zip checksum
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: (cd dist && sha256sum -c "ferrochat-v${VERSION}-windows-x86_64.zip.sha256")
      - name: Create GitHub Release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          name="ferrochat-v${VERSION}-linux-x86_64"
          win="ferrochat-v${VERSION}-windows-x86_64"
          gh release create "v${VERSION}" --target "$SHA" \
            --title "Ferrochat v${VERSION}" --generate-notes \
            "dist/$name.tar.gz" "dist/$name.tar.gz.sha256" \
            "dist/$win.zip" "dist/$win.zip.sha256"
