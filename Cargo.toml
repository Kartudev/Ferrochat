[package]
name = "ferrochat"
version = "0.16.0"
edition = "2024"
rust-version = "1.94"
description = "Unofficial lightweight native WhatsApp desktop client written in Rust"
license = "MIT"
repository = "https://github.com/Kartudev/Ferrochat-kartu"
readme = "README.md"
publish = false
default-run = "ferrochat"

[features]
default = ["video"]
# In-app video playback: the `ferrochat-player` helper process decodes MP4
# (H.264 + AAC) with statically linked decoders; no system codec libraries.
# The main binary links none of them.
video = ["dep:openh264", "dep:mp4", "dep:symphonia"]

[[bin]]
name = "ferrochat-player"
path = "src/bin/ferrochat-player/main.rs"
required-features = ["video"]

[[test]]
name = "video_player"
required-features = ["video"]

[dependencies]
# UI
iced = { version = "0.14", features = ["tokio", "image", "advanced", "svg", "canvas"] }
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
futures = "0.3"
# Channel type the whatsapp-rust VoIP facade takes for PCM endpoints (already in the tree through it).
async-channel = "2"
# WhatsApp multi-device protocol (pure Rust). Default features off so the
# bundled plain SQLite is NOT linked: we link SQLCipher instead (see below).
whatsapp-rust = { version = "0.7", default-features = false, features = ["tokio-runtime", "tokio-native", "tokio-transport", "ureq-client", "voip"] }
whatsapp-rust-sqlite-storage = { version = "0.7", default-features = false }
libsqlite3-sys = { version = "0.37", features = ["bundled-sqlcipher"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
# Local cache
rusqlite = "0.39"
# Secrets
keyring = "4.2"
secrecy = "0.10"
zeroize = "1"
getrandom = "0.3"
hex = "0.4"
# Logging / errors / config
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Feature crates
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
notify-rust = "4"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
rodio = { version = "0.21", default-features = false, features = ["playback"] }
ogg = "0.9"
opus = "0.3"
# Same crate opus uses; "static" links libopus.a so the binary has no runtime libopus dependency.
audiopus_sys = { version = "0.2", features = ["static"] }
# Opens documents without a shell (ShellExecuteW on Windows, xdg-open/open elsewhere).
open = { version = "5", features = ["shellexecute-on-windows"] }
lru = "0.16"
# Reads copied images and file lists for paste-to-send (X11, Wayland data-control, Windows); same crate as Ferrocord.
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
# Video helper (in `ferrochat-player` only), no system libraries:
# H.264 decoder (Cisco's BSD OpenH264, built from source, linked statically; Main/High with B-frames).
openh264 = { version = "0.9", optional = true }
# Pure-Rust MP4 demuxer for the H.264 track (sample table, avcC, rotation).
mp4 = { version = "0.14", optional = true }
# Pure-Rust AAC decoder + MP4 audio demuxer (symphonia is already in the tree through rodio).
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"], optional = true }
# Grapheme clusters, so keycaps, flags and ZWJ emoji are never split (already in the tree via iced).
unicode-segmentation = "1"
# Script type of cosmic-text's font fallback trait (Twemoji first); already in the tree via cosmic-text.
unicode-script = "0.5"
# Unicode emoji list with groups, names and shortcodes for the picker (data only, no deps); same crate as Ferrocord.
emojis = "0.9"
# In-app updater (src/update/): HTTPS client already in the tree via whatsapp-rust (same features).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Updater: URL / redirect policy (already in the tree via ureq).
url = "2"
# Updater: release checksum (already in the tree via wacore).
sha2 = "0.11"
# Updater: release tarball gzip (already in the tree via png).
flate2 = "1"
# Updater: reads the release tarball (new; pure Rust, xattr feature off).
tar = { version = "0.4", default-features = false }
# Updater: reads the Windows release .zip (new; only deflate through the flate2 already here).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Renders the app's SVG icon to ARGB32 tray pixmaps / the window icon (already in the tree via iced's svg).
resvg = { version = "0.45", default-features = false }

[target.'cfg(windows)'.dependencies]
# Windows has no system OpenSSL for SQLCipher: build it from source (same libsqlite3-sys, one more feature).
libsqlite3-sys = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
# "Start at login" (HKCU Run key); already in the tree via tokio/winit, only the registry API is added.
# Same crate, also the notification-area tray icon (Shell_NotifyIconW, menus, icons).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem tray icon, pure Rust over zbus 5 (the zbus already in the tree).
ksni = { version = "0.3", default-features = false, features = ["async-io"] }

[build-dependencies]
# Embeds the .ico into ferrochat.exe on Windows (rc.exe / windres); does nothing on other targets.
embed-resource = "3"

[dev-dependencies]
# Reads the bundled Twemoji's tables in tests (already in the tree via fontdb).
ttf-parser = "0.25"
# Runs `iced::Task`s headlessly so tests can drive the app against the fake client
# (same crate version iced already uses; dev-only).
iced_runtime = "0.14"
# Fake StatusNotifierWatcher for the tray integration test (zbus 5, already in the tree).
zbus = "5"
waproto = { version = "0.7", features = ["serde-deserialize"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "unwind"


# Keep debug builds small (test binaries with full debuginfo add up fast).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
